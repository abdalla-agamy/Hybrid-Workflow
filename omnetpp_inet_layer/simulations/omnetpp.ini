[General]
network = dt_hsbp_omnet.simulations.SwarmTraceNetwork
sim-time-limit = 105s
seed-set = 42

# Wireless channel & IEEE 802.11a/g Ad-Hoc MAC/PHY aligned with SimPy parameters
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha = 2.5
*.radioMedium.pathLoss.sigma = 2.0
*.radioMedium.backgroundNoise.power = -110dBm

*.uav[*].wlan[0].typename = "Ieee80211Interface"
*.uav[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.uav[*].wlan[0].radio.carrierFrequency = 5.18GHz
*.uav[*].wlan[0].radio.bandwidth = 20MHz
*.uav[*].wlan[0].radio.transmitter.power = 20mW
*.uav[*].wlan[0].radio.receiver.sensitivity = -85dBm
*.uav[*].wlan[0].radio.receiver.energyDetection = -85dBm
*.uav[*].wlan[0].mac.dcf.channelAccess.cwMin = 15
*.uav[*].wlan[0].mac.dcf.channelAccess.cwMax = 1023
*.uav[*].wlan[0].mac.dcf.recoveryProcedure.shortRetryLimit = 3
*.uav[*].wlan[0].mac.mtu = 1500B

# Trace-driven mobility is updated explicitly by TraceEventPlayer
*.uav[*].mobility.typename = "StationaryMobility"
*.uav[*].mobility.initFromDisplayString = false
*.uav[*].ipv4.arp.typename = "GlobalArp"

# Trace player defaults
*.tracePlayer.enableMultiHopForwarding = true
*.tracePlayer.mtuBytes = 1500
*.tracePlayer.commRangeM = 350m

[Config DTHSBP_Smoke]
description = "Smoke validation replaying DTHSBP N=50 sample trace at 6 Mbps"
*.numUavs = 65
*.uav[*].wlan[0].bitrate = 6Mbps
*.tracePlayer.traceFile = "../../traces/samples/events_trace_DTHSBP_N50.json"

[Config AllProtocols_N50]
description = "Cross-protocol sweep over all 5 N=50 sample traces"
repeat = 1
*.numUavs = 65
*.uav[*].wlan[0].bitrate = ${bitrate=6Mbps, 54Mbps}
*.tracePlayer.traceFile = ${trace="../../traces/samples/events_trace_FlatSBP_N50.json", \
                                   "../../traces/samples/events_trace_HSBP_N50.json", \
                                   "../../traces/samples/events_trace_DTHSBP_N50.json", \
                                   "../../traces/samples/events_trace_LKH_N50.json", \
                                   "../../traces/samples/events_trace_TGDH_N50.json"}

[Config Scale_N250]
description = "N=250 comparison using full MATLAB run traces"
*.numUavs = 280
*.uav[*].wlan[0].bitrate = ${bitrate=6Mbps, 54Mbps}
*.tracePlayer.traceFile = ${trace="../../traces/runs/events_trace_HSBP_N250.json", \
                                   "../../traces/runs/events_trace_DTHSBP_N250.json", \
                                   "../../traces/runs/events_trace_LKH_N250.json"}
