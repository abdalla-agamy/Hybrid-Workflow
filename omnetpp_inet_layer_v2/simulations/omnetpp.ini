[General]
network = dt_hsbp_omnet_v2.simulations.DTHSBPV2SwarmNetwork
ned-path = .;../src;F:/omnetpp-6.5.0/samples/inet-4.7.0/src
sim-time-limit = 20s
seed-set = 42
num-rngs = 3
**.wlan[*].mac.rng-0 = 2

# Headless memory/speed safeguards (retain ScenarioManager + EDCA + MAC scalars)
cmdenv-express-mode = true
cmdenv-status-frequency = 60s
record-eventlog = false
output-scalar-file = ../results/${configname}-${repetition}-${runnumber}.sca
output-vector-file = ../results/${configname}-${repetition}-${runnumber}.vec
**.vector-recording = false
**.statistic-recording = true
**.bin-recording = false
**.result-recording-modes = count
**.param-recording = false
*.scenarioManager.*.scalar-recording = true
*.uav[*].app[0].*.scalar-recording = true
*.uav[*].wlan[*].mac.hcf.edca.edcaf[*].packetSentToPeer*.scalar-recording = true
*.uav[*].wlan[*].mac.hcf.edca.edcaf[*].pendingQueue.packetDropQueueOverflow*.scalar-recording = true
*.uav[*].wlan[*].mac.dcf.packetSentToPeer*.scalar-recording = true
*.uav[*].wlan[*].mac.packetDrop*.scalar-recording = true
**.scalar-recording = false

# IPv4 /16 subnet supporting dense UAV swarms with GlobalArp
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.255.0.0'/></config>")
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.addDirectRoutes = false
*.configurator.optimizeRoutes = false
*.uav[*].ipv4.arp.typename = "GlobalArp"
*.uav[*].ipv4.ip.limitedBroadcast = true

# Physical air-to-air channel: RicianFading over FSPL (alpha=2.0, 2.412 GHz, 100 mW)
*.radioMedium.pathLoss.typename = "RicianFading"
*.radioMedium.pathLoss.alpha = 2.0
*.radioMedium.pathLoss.k = 4dB
*.radioMedium.backgroundNoise.power = -110dBm
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
*.radioMedium.rangeFilter = "interferenceRange"
*.radioMedium.radioModeFilter = true
*.radioMedium.listeningFilter = true
*.radioMedium.communicationCache.typename = "MapCommunicationCache"
*.radioMedium.mediumLimitCache.maxTransmissionDuration = 5ms
*.radioMedium.mediumLimitCache.centerFrequency = 2.412GHz
*.radioMedium.mediumLimitCache.minReceptionPower = -71.5dBm
*.radioMedium.mediumLimitCache.minInterferencePower = -77.5dBm

# IEEE 802.11g/e 54 Mbps EDCA (stock INET Hcf verified deadlock-free)
*.uav[*].wlan[0].typename = "Ieee80211Interface"
*.uav[*].wlan[0].opMode = "g(mixed)"
*.uav[*].wlan[0].bitrate = 54Mbps
*.uav[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.uav[*].wlan[0].radio.centerFrequency = 2.412GHz
*.uav[*].wlan[0].radio.transmitter.power = 100mW
*.uav[*].wlan[0].radio.receiver.sensitivity = -71.5dBm
*.uav[*].wlan[0].radio.receiver.energyDetection = -77.5dBm
*.uav[*].wlan[0].radio.receiver.snirThreshold = 4dB

*.uav[*].wlan[0].mac.mtu = 1500B
*.uav[*].wlan[0].mac.qosStation = true
*.uav[*].wlan[0].mac.hcf.edca.edcaf[*].pendingQueue.packetCapacity = 4096
*.uav[*].wlan[0].mac.hcf.edca.edcaf[*].recoveryProcedure.shortRetryLimit = 3
*.uav[*].wlan[0].mac.hcf.edca.edcaf[*].recoveryProcedure.longRetryLimit = 3
*.uav[*].wlan[0].mac.dcf.typename = "dt_hsbp_omnet_v2.src.SafeDcf"
*.uav[*].wlan[0].mac.dcf.channelAccess.cwMin = 15
*.uav[*].wlan[0].mac.dcf.channelAccess.cwMax = 1023
*.uav[*].wlan[0].mac.dcf.channelAccess.pendingQueue.packetCapacity = 4096
*.uav[*].wlan[0].mac.dcf.recoveryProcedure.shortRetryLimit = 3
*.uav[*].wlan[0].mac.dcf.recoveryProcedure.longRetryLimit = 3

# Mobility area allowing parked reserve slots at (-5000, -5000)
*.uav[*].mobility.updateInterval = 0.5s
*.uav[*].mobility.constraintAreaMinX = -10000m
*.uav[*].mobility.constraintAreaMaxX = 10000m
*.uav[*].mobility.constraintAreaMinY = -10000m
*.uav[*].mobility.constraintAreaMaxY = 10000m
*.uav[*].mobility.constraintAreaMinZ = 0m
*.uav[*].mobility.constraintAreaMaxZ = 100m
*.uav[*].mobility.initialX = -5000m
*.uav[*].mobility.initialY = -5000m
*.uav[*].mobility.initialZ = 0m
*.uav[*].mobility.initFromDisplayString = false
*.uav[*].mobility.updateFromDisplayString = false

*.scenarioManager.simDurationSec = 20.0
*.scenarioManager.ricianKDb = 4.0
*.scenarioManager.qosEnabled = true
*.scenarioManager.joinRatePerSec = 0.40
*.scenarioManager.leaveRatePerSec = 0.40
*.scenarioManager.failureRatePerSec = 0.20
*.scenarioManager.disturbanceRatePerSec = 0.20
*.scenarioManager.slFailoverTimeSec = 11.0

[Config V2_Smoke]
description = "Quick smoke verification: DTHSBP N=50 at 54 Mbps EDCA, moderate fading k=4 dB"
sim-time-limit = 20s
*.numUavs = 70
*.scenarioManager.protocol = "DTHSBP"
*.scenarioManager.initialSwarmSize = 50
*.scenarioManager.simDurationSec = 20.0
*.scenarioManager.slFailoverTimeSec = 11.0

[Config V2_StressSmoke_N250]
description = "Dense N=250 54 Mbps EDCA stress verification (DTHSBP)"
sim-time-limit = 20s
*.numUavs = 270
*.scenarioManager.protocol = "DTHSBP"
*.scenarioManager.initialSwarmSize = 250
*.scenarioManager.simDurationSec = 20.0
*.scenarioManager.slFailoverTimeSec = 11.0

[Config V2_Scalability_54M]
description = "Closed-loop EDCA scalability N in {50, 100, 200, 250} across 5 protocols (54 Mbps, k=4 dB, 5 seeds)"
repeat = 5
seed-set = ${repetition}
*.numUavs = ${n=50, 100, 200, 250} + 20
*.scenarioManager.initialSwarmSize = ${n}
*.scenarioManager.protocol = "${proto=FlatSBP,HSBP,DTHSBP,LKH,TGDH}"
*.scenarioManager.ricianKDb = 4.0
*.radioMedium.pathLoss.k = 4dB

[Config V2_FadingResilience_54M]
description = "Physical air-to-air Rician fading k in {10, 0} dB across 5 protocols at N=250 (k=4 dB shared with Scalability, 5 seeds)"
repeat = 5
seed-set = ${repetition}
*.numUavs = 270
*.scenarioManager.initialSwarmSize = 250
*.scenarioManager.protocol = "${proto=FlatSBP,HSBP,DTHSBP,LKH,TGDH}"
*.scenarioManager.ricianKDb = ${k=10, 0}
*.radioMedium.pathLoss.k = ${k}dB

[Config V2_EDCA_vs_DCF_Ablation]
description = "DCF (qosStation=false SafeDcf) ablation leg across {DTHSBP, FlatSBP} at N in {100, 250} (qos=true shared with Scalability, 5 seeds)"
repeat = 5
seed-set = ${repetition}
*.numUavs = ${n=100, 250} + 20
*.scenarioManager.initialSwarmSize = ${n}
*.scenarioManager.protocol = "${proto=DTHSBP,FlatSBP}"
*.uav[*].wlan[0].mac.qosStation = false
*.scenarioManager.qosEnabled = false
*.scenarioManager.ricianKDb = 4.0
*.radioMedium.pathLoss.k = 4dB
